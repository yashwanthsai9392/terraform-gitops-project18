name: Terraform Apply
 
on:
  push:
    branches:
      - main
 
jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment: production
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: hashicorp/setup-terraform@v3
 
      - run: terraform init
 
      - run: terraform apply -auto-approve
